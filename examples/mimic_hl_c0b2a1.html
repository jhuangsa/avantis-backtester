function chart(id,series,fmt){
  const W=960,H=300,L=52,R=12,T=10,B=26,el=document.getElementById(id),t=D.t;

  const svg=el.querySelector("svg"),tip=el.querySelector(".tip"),cx=el.querySelector(`#${id}x`);

}
